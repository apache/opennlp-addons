# Publishes SNAPSHOT artifacts to repository.apache.org on demand. Run it from the
# Actions view, selecting the branch to publish. On main the pom version deploys as
# is and the feature input must be left empty. On any other branch the feature name
# becomes part of the version, so publishing branch FEATURE-XYZ deploys
# 3.0.0-FEATURE-XYZ-SNAPSHOT and cannot shadow the main snapshots; the name is the
# branch name unless the feature input supplies a different one, and a pom version
# that already names the feature is kept unchanged.
# Non-SNAPSHOT versions are never deployed by this workflow.

name: Publish snapshot artifacts

on:
  workflow_dispatch:
    inputs:
      feature:
        description: >-
          Feature name for a branch publish; the artifacts deploy as
          <version>-<feature>-SNAPSHOT. Defaults to the branch name on any branch
          other than main, and must be empty on main.
        required: false
        type: string

jobs:
  publish:
    name: Publish snapshot artifacts
    if: github.repository == 'apache/opennlp-addons'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Maven Repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - id: version
        name: Determine deploy version
        shell: bash
        env:
          FEATURE_INPUT: ${{ inputs.feature }}
        run: |
          POM_VERSION=$(mvn exec:exec -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive -q)
          if [[ "$POM_VERSION" != *-SNAPSHOT ]]; then
            echo "Refusing to publish non-SNAPSHOT version $POM_VERSION" >&2
            exit 1
          fi
          DEPLOY_VERSION="$POM_VERSION"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            if [[ -n "$FEATURE_INPUT" ]]; then
              echo "The feature input must be empty when publishing main" >&2
              exit 1
            fi
          else
            FEATURE_NAME="${FEATURE_INPUT:-$GITHUB_REF_NAME}"
            FEATURE=$(printf '%s' "$FEATURE_NAME" | tr -c 'A-Za-z0-9.' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')
            if [[ -z "$FEATURE" ]]; then
              echo "No usable feature name in: $FEATURE_NAME" >&2
              exit 1
            fi
            if [[ "$POM_VERSION" != *"$FEATURE"* ]]; then
              DEPLOY_VERSION="${POM_VERSION%-SNAPSHOT}-${FEATURE}-SNAPSHOT"
            fi
          fi
          echo "Deploying version $DEPLOY_VERSION from branch $GITHUB_REF_NAME"
          echo "version=$DEPLOY_VERSION" >> "$GITHUB_OUTPUT"
      - name: Deploy Maven snapshots
        env:
          ASF_USERNAME: ${{ secrets.NEXUS_USER }}
          ASF_PASSWORD: ${{ secrets.NEXUS_PW }}
          DEPLOY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mvn -B -q -ntp versions:set -DnewVersion="$DEPLOY_VERSION" -DgenerateBackupPoms=false
          echo "<settings><servers><server><id>apache.snapshots.https</id><username>$ASF_USERNAME</username><password>$ASF_PASSWORD</password></server></servers></settings>" > settings.xml
          mvn --settings settings.xml -U -B -e -fae -ntp -DskipTests deploy
